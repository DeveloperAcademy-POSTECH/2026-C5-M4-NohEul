# 로컬 개발·테스트 전용 MySQL. 비밀번호는 공개된 개발용 값이므로 운영에 쓰지 않는다.
# 포트는 127.0.0.1에만 바인딩해 같은 네트워크의 다른 기기에서 접속할 수 없게 한다.
# 접속 정보는 coffee-coupon-api/src/main/resources/application.yaml의 기본값과 일치한다.
services:
  mysql:
    image: mysql:8.4
    container_name: coffee-coupon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: coffee
      MYSQL_DATABASE: coffee_coupon
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcoffee"]
      interval: 5s
      timeout: 3s
      retries: 20
