spring:
  application:
    name: coffee-coupon-api
  profiles:
    active: local
  # 기본값은 루트 docker-compose.yml의 MySQL(호스트 포트 13306, root/coffee)과 일치하는 로컬 개발 전용 값이다.
  # 운영 환경에서는 반드시 환경 변수로 실제 접속 정보를 주입한다.
  # 다른 DB를 쓰려면 DB_URL/DB_USERNAME/DB_PASSWORD 환경 변수나 application-local.yaml(gitignore 대상)로 덮어쓴다.
  # 단, application-local.yaml이 있으면 그 값이 DB_URL보다 우선한다. 둘 다 이기려면 SPRING_DATASOURCE_URL을 쓴다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/coffee_coupon?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:coffee}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
