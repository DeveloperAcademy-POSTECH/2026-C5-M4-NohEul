spring:
  application:
    name: coffee-coupon-api
  # 기본값은 루트 .env(docker-compose와 부하테스트 스크립트가 읽는 파일)의 MySQL 설정과 일치하는 로컬 개발 전용 값이다.
  # 스프링은 .env를 읽지 않으므로, .env 값을 바꾸면 아래 기본값(포트 13306, root/coffee, DB coffee_coupon)도 같이 바꾼다.
  # 운영 환경에서는 반드시 환경 변수로 실제 접속 정보를 주입한다.
  # 다른 DB를 쓰려면 DB_URL/DB_USERNAME/DB_PASSWORD 환경 변수로 덮어쓴다.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/coffee_coupon?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:coffee}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
